name: Deploy Azure

on:
  push:
    paths:
      - api/**
      - infra/**
      - '!infra/bootstrap/**'
      - public/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_BOOTSTRAPPED == 'true' && github.ref_name == vars.AZURE_DEPLOYMENT_BRANCH
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix api

      - name: Run tests
        run: npm test

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: whatIf
          name: profile-counter-what-if
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          template-file: ./infra/main.bicep
          parameters-file: ./infra/main.bicepparam

      - name: Deploy infrastructure
        id: infrastructure
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          name: profile-counter
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          template-file: ./infra/main.bicep
          parameters-file: ./infra/main.bicepparam

      - name: Read Static Web Apps deployment token
        id: static-web-app-token
        env:
          STATIC_WEB_APP_NAME: ${{ steps.infrastructure.outputs.staticWebAppName }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        shell: bash
        run: |
          az extension add --name staticwebapp --upgrade --yes
          token="$(az staticwebapp secrets list \
            --name "${STATIC_WEB_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.apiKey \
            --output tsv)"
          if [[ -z "${token}" ]]; then
            echo "Azure returned an empty Static Web Apps deployment token." >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Deploy site and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-web-app-token.outputs.token }}
          action: upload
          app_location: public
          api_location: api
          output_location: ""
          skip_app_build: true
